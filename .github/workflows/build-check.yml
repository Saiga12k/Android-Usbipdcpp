# 提交与 PR 的编译验证：只构建 debug，不发布任何产物
name: Build Check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 校验 JNI 错误码与 Kotlin 镜像一致
        run: |
          # ErrorCode 是跨语言镜像（C++ 值经 JNI 原样传给 Kotlin），两边注释
          # 互相提醒但编译期发现不了漏改，这里做静态比对。提取限定在各自的
          # ErrorCode 定义块内：文件里新增其他常量不会被误抓。块内行格式若
          # 改变需要同步调整正则；提取为空会直接失败而不是静默通过
          cpp=$(awk '/^namespace ErrorCode \{/,/^\}/' app/src/main/cpp/usbipd_jni.cpp \
            | grep -oE 'constexpr int [A-Z_]+ = [0-9]+' | sed 's/constexpr int //' | sort)
          kotlin=$(awk '/object ErrorCode \{/,/^\s*\}/' app/src/main/java/com/yunsmall/usbipdcpp/UsbIpNative.kt \
            | grep -oE 'const val [A-Z_]+ = [0-9]+' | sed 's/const val //' | sort)
          if [ -z "$cpp" ] || [ -z "$kotlin" ]; then
            echo "::error::ErrorCode 提取为空（定义块格式疑似变化，检查本步的正则）"
            exit 1
          fi
          if [ "$cpp" != "$kotlin" ]; then
            echo "::error::ErrorCode 两侧不一致（左 C++，右 Kotlin）："
            diff <(echo "$cpp") <(echo "$kotlin") || true
            exit 1
          fi
          echo "ErrorCode 一致：$(echo "$cpp" | grep -c '=') 项"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: 设置 vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          # manifest 模式（vcpkg.json + CMAKE_TOOLCHAIN_FILE）下依赖走二进制缓存，
          # 默认落在 ~/.cache/vcpkg/archives；显式指定固定目录，缓存路径才可控
          # （~/vcpkg/packages、~/vcpkg/buildtrees 只有经典模式 install 才用，这里是空的）
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> $GITHUB_ENV

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: 缓存 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          # 此处配置需与 release.yml、build-apk.yml 完全一致，三处共享同一份缓存
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-

      - name: 安装构建工具（vcpkg libusb 需要 autotools）
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          # 编译已经花了几分钟，导出产物只需几秒；带 sha 便于区分是哪次提交的
          name: usbipdcpp-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
