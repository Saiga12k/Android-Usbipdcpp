# 手动编译 APK（仅验证编译，不发布）
name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release
      km6_compat:
        description: 'Build the KM6 Android 10 compatibility APK'
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: 设置 vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          # manifest 模式（vcpkg.json + CMAKE_TOOLCHAIN_FILE）下依赖走二进制缓存，
          # 默认落在 ~/.cache/vcpkg/archives；显式指定固定目录，缓存路径才可控
          # （~/vcpkg/packages、~/vcpkg/buildtrees 只有经典模式 install 才用，这里是空的）
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> $GITHUB_ENV

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: 缓存 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          # 此处配置需与 release.yml、build-check.yml 完全一致，三处共享同一份缓存
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-

      - name: 安装构建工具（vcpkg libusb 需要 autotools）
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: 编译 APK
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} -Pkm6Compat=${{ inputs.km6_compat }}

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbipdcpp-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
